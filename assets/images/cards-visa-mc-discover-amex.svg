  <!-- Mastercard -->
  <rect x="56" y="2" width="50" height="28" rx="4" fill="#252525"/>
  <circle cx="78" cy="16" r="10" fill="#EB001B"/>
  <circle cx="92" cy="16" r="10" fill="#F79E1B"/>
  <path d="M85 8.5 a10 10 0 0 1 0 15 a10 10 0 0 1 0-15z" fill="#FF5F00"/>
  <!-- Discover -->
  <rect x="112" y="2" width="50" height="28" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
