# This plugin is distributed via GitHub releases only (not WordPress.org SVN).
# This workflow is intentionally disabled to prevent failed action emails.
name: Deploy to WordPress.org

on:
  workflow_dispatch:  # manual only — never fires on push/tag

jobs:
  skip:
    name: WP.org deploy not configured
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "WP.org SVN deploy is not configured for this plugin. Distributed via GitHub releases only."
